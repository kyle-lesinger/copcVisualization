<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Potree Loader Test</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #canvas {
      width: 100%;
      height: 100vh;
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 15px;
      border-radius: 5px;
      font-size: 14px;
      max-width: 400px;
    }
    #info h2 {
      margin: 0 0 10px 0;
      font-size: 18px;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 20px;
      border-radius: 5px;
      font-size: 16px;
      display: none;
    }
    #error {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 0, 0, 0.8);
      color: white;
      padding: 20px;
      border-radius: 5px;
      font-size: 16px;
      display: none;
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 10px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="info">
    <h2>🌳 Potree Loader Test</h2>
    <div id="stats">
      <p>Loading...</p>
    </div>
    <p style="font-size: 12px; margin-top: 10px; color: #aaa;">
      Mouse: Rotate<br>
      Scroll: Zoom<br>
      Right-click: Pan
    </p>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <p>Loading Potree data...</p>
  </div>

  <div id="error">
    <h3>Error Loading Data</h3>
    <p id="error-message"></p>
  </div>

  <!-- Three.js from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.159.0/examples/js/controls/OrbitControls.js"></script>

  <script type="module">
    // Simple Potree metadata loader
    async function loadPotreeMetadata(baseUrl) {
      const metadataUrl = baseUrl.endsWith('/') ? `${baseUrl}metadata.json` : `${baseUrl}/metadata.json`
      console.log(`[Test] Loading metadata from: ${metadataUrl}`)

      const response = await fetch(metadataUrl)
      if (!response.ok) {
        throw new Error(`Failed to fetch metadata: ${response.statusText}`)
      }

      const metadata = await response.json()
      console.log(`[Test] Metadata loaded:`, metadata)
      return metadata
    }

    // Simple Potree point data loader
    async function loadPotreeData(baseUrl, metadata) {
      const octreeUrl = baseUrl.endsWith('/') ? `${baseUrl}octree.bin` : `${baseUrl}/octree.bin`
      console.log(`[Test] Loading octree from: ${octreeUrl}`)

      const response = await fetch(octreeUrl)
      if (!response.ok) {
        throw new Error(`Failed to fetch octree: ${response.statusText}`)
      }

      const arrayBuffer = await response.arrayBuffer()
      console.log(`[Test] Loaded octree.bin: ${(arrayBuffer.byteLength / 1024 / 1024).toFixed(2)} MB`)

      // Parse the binary point data
      return parsePotreePoints(arrayBuffer, metadata)
    }

    // Parse Potree binary point data
    function parsePotreePoints(buffer, metadata) {
      console.log(`[Test] Parsing ${metadata.points} points from buffer`)

      // Calculate point stride (total bytes per point)
      const stride = metadata.attributes.reduce((sum, attr) => sum + attr.size, 0)
      console.log(`[Test] Point stride: ${stride} bytes`)

      // Find attribute offsets
      let offset = 0
      const attributeOffsets = {}
      for (const attr of metadata.attributes) {
        attributeOffsets[attr.name] = offset
        offset += attr.size
      }

      // Allocate output arrays for max possible points
      const maxPoints = Math.floor(buffer.byteLength / stride)
      const positions = new Float32Array(maxPoints * 3)
      const intensities = new Uint16Array(maxPoints)

      const view = new DataView(buffer)
      let validPoints = 0

      // Bounds tracking
      let minX = Infinity, minY = Infinity, minZ = Infinity
      let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity

      // Parse each point (limit to first 1M points for test)
      const pointsToLoad = Math.min(maxPoints, 1000000)
      for (let i = 0; i < pointsToLoad; i++) {
        const pointOffset = i * stride

        // Read position (int32 x, y, z)
        const posOffset = pointOffset + attributeOffsets['position']
        const x = view.getInt32(posOffset, true) * metadata.scale[0] + metadata.offset[0]
        const y = view.getInt32(posOffset + 4, true) * metadata.scale[1] + metadata.offset[1]
        const z = view.getInt32(posOffset + 8, true) * metadata.scale[2] + metadata.offset[2]

        // Read intensity (uint16)
        const intensityOffset = pointOffset + attributeOffsets['intensity']
        const intensity = view.getUint16(intensityOffset, true)

        // Store in output arrays
        positions[validPoints * 3] = x
        positions[validPoints * 3 + 1] = y
        positions[validPoints * 3 + 2] = z
        intensities[validPoints] = intensity

        // Update bounds
        minX = Math.min(minX, x)
        minY = Math.min(minY, y)
        minZ = Math.min(minZ, z)
        maxX = Math.max(maxX, x)
        maxY = Math.max(maxY, y)
        maxZ = Math.max(maxZ, z)

        validPoints++
      }

      console.log(`[Test] Parsed ${validPoints} points`)
      console.log(`[Test] Bounds:`, { minX, maxX, minY, maxY, minZ, maxZ })

      return {
        positions: positions.slice(0, validPoints * 3),
        intensities: intensities.slice(0, validPoints),
        pointCount: validPoints,
        bounds: {
          min: [minX, minY, minZ],
          max: [maxX, maxY, maxZ]
        }
      }
    }

    // Compute elevation colors
    function computeElevationColors(positions, minAlt, maxAlt) {
      const colors = new Uint8Array(positions.length)
      const range = maxAlt - minAlt

      for (let i = 0; i < positions.length; i += 3) {
        const alt = positions[i + 2]
        const t = (alt - minAlt) / range

        // Plasma colormap approximation
        const r = Math.floor(255 * Math.max(0, Math.min(1, 1.5 * t)))
        const g = Math.floor(255 * Math.max(0, Math.min(1, 1.5 * (t - 0.3))))
        const b = Math.floor(255 * Math.max(0, Math.min(1, 1.5 * (0.7 - t))))

        colors[i] = r
        colors[i + 1] = g
        colors[i + 2] = b
      }

      return colors
    }

    // Main function
    async function main() {
      const loadingEl = document.getElementById('loading')
      const errorEl = document.getElementById('error')
      const errorMsgEl = document.getElementById('error-message')
      const statsEl = document.getElementById('stats')

      try {
        loadingEl.style.display = 'block'

        // CONFIGURE THIS: Path to your Potree directory
        const potreeUrl = '/potree_data/CAL_LID_L1-Standard-V4-51.2023-06-30T16-44-43ZD'

        console.log(`[Test] Loading Potree from: ${potreeUrl}`)

        // Load metadata
        const metadata = await loadPotreeMetadata(potreeUrl)

        // Load point data (limited to 1M points for test)
        const pointData = await loadPotreeData(potreeUrl, metadata)

        loadingEl.style.display = 'none'

        // Set up Three.js scene
        const canvas = document.getElementById('canvas')
        const scene = new THREE.Scene()
        scene.background = new THREE.Color(0x000020)

        const camera = new THREE.PerspectiveCamera(
          75,
          window.innerWidth / window.innerHeight,
          0.1,
          1000
        )

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true })
        renderer.setSize(window.innerWidth, window.innerHeight)

        // Add orbit controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement)
        controls.enableDamping = true
        controls.dampingFactor = 0.05

        // Create point cloud
        const geometry = new THREE.BufferGeometry()
        geometry.setAttribute('position', new THREE.BufferAttribute(pointData.positions, 3))

        // Compute colors based on elevation
        const colors = computeElevationColors(
          pointData.positions,
          pointData.bounds.min[2],
          pointData.bounds.max[2]
        )
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3, true))

        const material = new THREE.PointsMaterial({
          size: 0.5,
          vertexColors: true,
          sizeAttenuation: true
        })

        const points = new THREE.Points(geometry, material)
        scene.add(points)

        // Center camera on data
        const centerX = (pointData.bounds.min[0] + pointData.bounds.max[0]) / 2
        const centerY = (pointData.bounds.min[1] + pointData.bounds.max[1]) / 2
        const centerZ = (pointData.bounds.min[2] + pointData.bounds.max[2]) / 2

        const extentX = pointData.bounds.max[0] - pointData.bounds.min[0]
        const extentY = pointData.bounds.max[1] - pointData.bounds.min[1]
        const extentZ = pointData.bounds.max[2] - pointData.bounds.min[2]
        const maxExtent = Math.max(extentX, extentY, extentZ)

        camera.position.set(centerX, centerY - maxExtent * 1.5, centerZ + maxExtent * 1.5)
        controls.target.set(centerX, centerY, centerZ)
        controls.update()

        // Update stats
        statsEl.innerHTML = `
          <p><strong>Points loaded:</strong> ${pointData.pointCount.toLocaleString()}</p>
          <p><strong>Bounds:</strong><br>
            Lon: ${pointData.bounds.min[0].toFixed(2)}° to ${pointData.bounds.max[0].toFixed(2)}°<br>
            Lat: ${pointData.bounds.min[1].toFixed(2)}° to ${pointData.bounds.max[1].toFixed(2)}°<br>
            Alt: ${pointData.bounds.min[2].toFixed(2)} to ${pointData.bounds.max[2].toFixed(2)} km
          </p>
          <p><strong>Status:</strong> ✅ Loaded successfully</p>
        `

        // Animation loop
        function animate() {
          requestAnimationFrame(animate)
          controls.update()
          renderer.render(scene, camera)
        }
        animate()

        // Handle window resize
        window.addEventListener('resize', () => {
          camera.aspect = window.innerWidth / window.innerHeight
          camera.updateProjectionMatrix()
          renderer.setSize(window.innerWidth, window.innerHeight)
        })

      } catch (error) {
        console.error('[Test] Error:', error)
        loadingEl.style.display = 'none'
        errorEl.style.display = 'block'
        errorMsgEl.textContent = error.message

        statsEl.innerHTML = `<p><strong>Status:</strong> ❌ Failed to load</p>`
      }
    }

    // Start the application
    main()
  </script>
</body>
</html>
